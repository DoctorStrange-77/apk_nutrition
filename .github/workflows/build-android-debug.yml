name: Build Android Debug APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore persistent debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: builder-nutrition-debug-keystore-v1

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: app-nutrition-web-pwa
          path: dist
          if-no-files-found: error

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Set Android debug version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          run_number = os.environ['GITHUB_RUN_NUMBER']
          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          text = text.replace('versionCode 1', f'versionCode {run_number}')
          text = text.replace('versionName "1.0"', f'versionName "{version}-dev.{run_number}"')
          gradle.write_text(text)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-nutrition-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
